<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Quickstart</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
textarea, input[type=text] { width: 100%; padding: .6rem; font-size: 1rem; }
button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: .5rem; }
.card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
.src { background: #f4f4f4; border-left: 4px solid #555; padding: .5rem .8rem; margin-top: .6rem; white-space: pre-wrap; }
.muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<h1>RAG Quickstart</h1>
<p class="muted" id="health">Checking health…</p>

<h2>Ask a question</h2>
<input type="text" id="q" placeholder="e.g. What is the storm deductible in the sample policy?">
<button onclick="ask()">Ask</button>
<div class="card" id="answer" style="display:none">
  <h3>Answer</h3>
  <div id="answerText" style="white-space: pre-wrap"></div>
  <h3>Sources</h3>
  <div id="sources"></div>
</div>

<h2>Upload a document (.txt / .md)</h2>
<input type="file" id="file" accept=".txt,.md">
<button onclick="upload()">Upload &amp; index</button>
<p class="muted" id="uploadMsg"></p>

<script>
async function loadHealth() {
  const r = await fetch('/health'); const h = await r.json();
  document.getElementById('health').textContent =
    `Indexed chunks: ${h.chunks_indexed} · Embeddings: ${h.embedding_model} · LLM: ${h.llm}`;
}
async function ask() {
  const question = document.getElementById('q').value.trim();
  if (!question) return;
  const r = await fetch('/ask', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ question }) });
  const d = await r.json();
  document.getElementById('answer').style.display = 'block';
  document.getElementById('answerText').textContent = `(${d.mode}) ${d.answer}`;
  document.getElementById('sources').innerHTML = d.sources.map(s =>
    `<div class="src"><b>${s.doc} — chunk ${s.chunk}</b>\n${s.text}</div>`).join('');
}
async function upload() {
  const f = document.getElementById('file').files[0];
  if (!f) { document.getElementById('uploadMsg').textContent = 'Pick a file first.'; return; }
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/ingest', { method: 'POST', body: fd });
  const d = await r.json();
  document.getElementById('uploadMsg').textContent = r.ok
    ? `Indexed ${d.doc}: ${d.chunks_added} chunks (total ${d.total_chunks}).`
    : `Error: ${d.error || 'upload failed'}`;
  loadHealth();
}
loadHealth();
</script>
</body>
</html>
