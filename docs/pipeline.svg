<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <style>
    .node{rx:14;stroke:#333;stroke-width:1.5}
    .t{font-size:14px;font-weight:700;text-anchor:middle;fill:#111}
    .s{font-size:11px;text-anchor:middle;fill:#444}
    .line{stroke:#555;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <!-- Row 1: ingest -->
  <rect x="10" y="20" width="150" height="70" class="node" fill="#dbeafe"/>
  <text x="85" y="50" class="t">Upload docs</text>
  <text x="85" y="70" class="s">.txt / .md files</text>
  <line x1="160" y1="55" x2="195" y2="55" class="line"/>
  <rect x="195" y="20" width="150" height="70" class="node" fill="#dcfce7"/>
  <text x="270" y="50" class="t">Chunk</text>
  <text x="270" y="70" class="s">~500 tokens each</text>
  <line x1="345" y1="55" x2="380" y2="55" class="line"/>
  <rect x="380" y="20" width="150" height="70" class="node" fill="#fef9c3"/>
  <text x="455" y="50" class="t">Embed</text>
  <text x="455" y="70" class="s">MiniLM, local, free</text>
  <line x1="530" y1="55" x2="565" y2="55" class="line"/>
  <rect x="565" y="20" width="150" height="70" class="node" fill="#fce7f3"/>
  <text x="640" y="50" class="t">ChromaDB</text>
  <text x="640" y="70" class="s">vectors, on disk</text>
  <!-- Row 2: ask -->
  <rect x="565" y="150" width="150" height="70" class="node" fill="#e0e7ff"/>
  <text x="640" y="180" class="t">Ask a question</text>
  <text x="640" y="200" class="s">your words</text>
  <line x1="640" y1="90" x2="640" y2="150" class="line"/>
  <rect x="380" y="150" width="150" height="70" class="node" fill="#dcfce7"/>
  <text x="455" y="180" class="t">Retrieve top 3</text>
  <text x="455" y="200" class="s">most similar chunks</text>
  <line x1="565" y1="185" x2="530" y2="185" class="line"/>
  <rect x="195" y="150" width="150" height="70" class="node" fill="#ffedd5"/>
  <text x="270" y="180" class="t">Gemini</text>
  <text x="270" y="200" class="s">free tier, your key</text>
  <line x1="380" y1="185" x2="345" y2="185" class="line"/>
  <rect x="10" y="150" width="150" height="70" class="node" fill="#d1fae5"/>
  <text x="85" y="180" class="t">Cited answer</text>
  <text x="85" y="200" class="s">answer + sources</text>
  <line x1="195" y1="185" x2="160" y2="185" class="line"/>
  <text x="430" y="260" class="s">No key? The app still works: it shows the retrieved passages instead of a generated answer.</text>
  <text x="430" y="280" class="s">Providers, in order: Gemini key → Groq key → local Ollama / Hermes → extractive mode.</text>
</svg>
